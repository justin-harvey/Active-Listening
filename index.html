<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Active Listener — hear what people are thinking</title>
<meta name="description" content="Active Listener lets you listen to other people's thoughts while you multitask. Post what's on your mind, and anyone can press play and hear it while they drive, walk, or train." />
<meta name="theme-color" content="#16130f" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#16130f; --ink-soft:#4a453d; --ink-faint:#8b8478;
    --paper:#fbfaf7; --card:#ffffff; --line:#e9e4da; --line-strong:#d8d1c4;
    --accent:#e8543a; --accent-dark:#c53f28; --accent-wash:#fdeee9;
    --radius:16px; --shadow:0 1px 2px rgba(22,19,15,.05), 0 10px 30px rgba(22,19,15,.06);
    --maxw:720px; font-synthesis:none; -webkit-text-size-adjust:100%;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent-wash)}

  /* nav */
  .nav{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,5vw,40px);background:rgba(251,250,247,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:19px;cursor:pointer}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center;color:#fff}
  .brand .mark svg{width:17px;height:17px}
  .brand small{color:var(--ink-faint);font-weight:500;font-size:12.5px;letter-spacing:0}
  @media(max-width:560px){.brand small{display:none}}
  .nav-actions{display:flex;align-items:center;gap:10px}
  .btn{font:inherit;font-weight:600;font-size:14px;cursor:pointer;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);padding:9px 16px;transition:.15s ease;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--ink);transform:translateY(-1px)}
  .btn svg{width:16px;height:16px}
  .btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.solid:hover{background:#000}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.accent:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
  .btn.small{padding:7px 13px;font-size:13px}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,5vw,24px)}
  .wide{max-width:900px}

  /* ---------------- FEED ---------------- */
  .hero{padding:clamp(30px,7vw,60px) 0 18px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .hero .eyebrow{color:var(--accent-dark);font-weight:600;font-size:13px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:9px}
  .hero .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .hero h1{font-family:"Newsreader",serif;font-weight:500;letter-spacing:-.015em;font-size:clamp(32px,6vw,50px);line-height:1.06;margin:0 0 16px;max-width:15ch}
  .hero p{font-family:"Newsreader",serif;font-size:clamp(17px,3vw,20px);color:var(--ink-soft);line-height:1.5;margin:0 0 22px;max-width:44ch}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .chip{font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:6px 13px;border-radius:999px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--line-strong)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .feed{display:flex;flex-direction:column;gap:16px;padding-bottom:20px}
  .post-card{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:.18s;cursor:pointer}
  .post-card:hover{transform:translateY(-2px);border-color:var(--line-strong)}
  .pc-play{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 16px rgba(232,84,58,.4);transition:.15s;align-self:center}
  .pc-play:hover{background:var(--accent-dark);transform:scale(1.06)}
  .pc-play svg{width:22px;height:22px}
  .pc-body{flex:1;min-width:0}
  .pc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .tag{font-size:11.5px;font-weight:600;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
  .tag.hot{color:var(--accent-dark);background:var(--accent-wash);border-color:#f6d8cf}
  .pc-title{font-family:"Newsreader",serif;font-size:22px;font-weight:600;line-height:1.2;margin:0 0 5px;letter-spacing:-.01em}
  .pc-dek{color:var(--ink-soft);font-size:14.5px;line-height:1.5;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;color:var(--ink-faint);font-size:12.5px}
  .pc-meta .who{display:flex;align-items:center;gap:7px;color:var(--ink-soft);font-weight:600}
  .pc-av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#f0a58f,#e8543a);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
  .pc-meta .m{display:flex;align-items:center;gap:5px}
  .pc-meta .m svg{width:13px;height:13px}
  @media(max-width:520px){.pc-title{font-size:19px}.pc-dek{-webkit-line-clamp:3}}

  .empty{text-align:center;color:var(--ink-faint);padding:40px 0;font-size:14px}

  /* ---------------- READER ---------------- */
  .article-head{padding:clamp(24px,6vw,44px) 0 4px}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--ink-faint);font-size:13px;font-weight:600;margin-bottom:20px}
  .backlink:hover{color:var(--ink)}
  .backlink svg{width:15px;height:15px}
  .kicker{display:flex;align-items:center;gap:10px;color:var(--accent-dark);font-weight:600;font-size:13px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:16px}
  .kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  h1.title{font-family:"Newsreader",serif;font-weight:500;letter-spacing:-.015em;font-size:clamp(32px,6.5vw,50px);line-height:1.08;margin:0 0 16px}
  .dek{font-family:"Newsreader",serif;font-size:clamp(18px,3vw,21px);color:var(--ink-soft);line-height:1.5;margin:0 0 24px;max-width:38ch}
  .tags-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .tags-row .tag{font-size:12.5px;padding:5px 11px;background:var(--card)}
  .byline{display:flex;align-items:center;gap:14px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#f0a58f,#e8543a);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
  .byline .who{flex:1;min-width:0}
  .byline .name{font-weight:700;font-size:15px}
  .byline .sub{color:var(--ink-faint);font-size:13px}
  .stats{display:flex;flex-wrap:wrap;gap:18px;padding:18px 0 2px;color:var(--ink-soft);font-size:13.5px}
  .stats .s{display:flex;align-items:center;gap:7px}
  .stats .s svg{width:15px;height:15px;color:var(--ink-faint);flex:none}
  .stats .s b{color:var(--ink);font-weight:600}

  /* listen banner */
  .listen{position:sticky;top:60px;z-index:50;margin:24px 0 8px}
  .listen-inner{background:linear-gradient(135deg,#1c1813,#2a231b);color:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(255,255,255,.06)}
  .listen-top{display:flex;align-items:center;gap:16px;padding:16px 18px}
  .play{flex:none;width:58px;height:58px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;color:#fff;display:grid;place-items:center;transition:.15s;box-shadow:0 6px 20px rgba(232,84,58,.45)}
  .play:hover{background:var(--accent-dark);transform:scale(1.04)}
  .play:active{transform:scale(.97)}
  .play:disabled{opacity:.5;cursor:not-allowed}
  .play svg{width:26px;height:26px}
  .play .ico-pause{display:none}
  body.playing .play .ico-play{display:none}
  body.playing .play .ico-pause{display:block}
  .listen-copy{flex:1;min-width:0}
  .listen-label{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#d9b7ad;font-weight:600}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  body.playing .live-dot{animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,84,58,.6)}70%{box-shadow:0 0 0 8px rgba(232,84,58,0)}100%{box-shadow:0 0 0 0 rgba(232,84,58,0)}}
  .listen-title{font-weight:600;font-size:15.5px;margin-top:3px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .listen-sub{color:#a89f92;font-size:12.5px;margin-top:1px}
  .mini{flex:none;display:flex;align-items:center;gap:6px}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.15s;position:relative;font:inherit}
  .iconbtn:hover{background:rgba(255,255,255,.12)}
  .iconbtn svg{width:19px;height:19px}
  .iconbtn.speed{width:auto;padding:0 12px;font-size:13px;font-weight:700}
  .skip-lbl{position:absolute;bottom:3px;right:3px;font-size:8px;font-weight:700;color:#d9b7ad}
  .progress-row{display:flex;align-items:center;gap:11px;padding:0 18px 14px}
  .time{font-size:11.5px;color:#a89f92;font-variant-numeric:tabular-nums;flex:none;width:44px}
  .time.right{text-align:right}
  .bar{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.12);cursor:pointer;position:relative}
  .bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:999px}
  .bar .knob{position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.4);opacity:0;transition:opacity .15s}
  .bar:hover .knob,body.playing .bar .knob{opacity:1}
  .listen-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;background:rgba(0,0,0,.22);border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:#a89f92}
  .voice-pick{display:flex;align-items:center;gap:8px;min-width:0}
  .voice-pick svg{width:15px;height:15px;color:#d9b7ad;flex:none}
  select.voice{background:transparent;border:none;color:#eee;font:inherit;font-size:12px;font-weight:600;max-width:160px;cursor:pointer;text-overflow:ellipsis}
  select.voice option{color:#111}
  .badge-quality{display:flex;align-items:center;gap:6px;font-weight:600;color:#d9b7ad}
  .badge-quality svg{width:14px;height:14px}

  .chapters{margin:14px 0 4px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
  .chapters summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;font-weight:600;font-size:14px}
  .chapters summary::-webkit-details-marker{display:none}
  .chapters summary svg{width:16px;height:16px;color:var(--ink-faint)}
  .chapters[open] summary svg.chev{transform:rotate(180deg)}
  .chapters .ch-list{border-top:1px solid var(--line);padding:6px}
  .chapters button.ch{display:flex;width:100%;text-align:left;gap:10px;align-items:baseline;background:none;border:none;font:inherit;cursor:pointer;color:var(--ink-soft);padding:9px 10px;border-radius:9px;font-size:14px}
  .chapters button.ch:hover{background:var(--paper);color:var(--ink)}
  .chapters button.ch .n{color:var(--ink-faint);font-variant-numeric:tabular-nums;font-size:12px;flex:none;width:20px}

  article{padding:14px 0 10px}
  article h2{font-family:"Newsreader",serif;font-weight:600;letter-spacing:-.01em;font-size:clamp(23px,4vw,29px);line-height:1.2;margin:44px 0 6px;scroll-margin-top:150px}
  article p{font-family:"Newsreader",serif;font-size:19.5px;line-height:1.68;margin:22px 0;color:#211d17}
  article p.lead{font-size:21px}
  .read-active{background:linear-gradient(transparent 62%,#fbe0d8 62%);transition:background .2s}
  .pull{font-family:"Newsreader",serif;font-style:italic;font-size:24px;line-height:1.4;color:var(--ink);border-left:3px solid var(--accent);padding:2px 0 2px 22px;margin:34px 0}
  .divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:40px 0;color:var(--line-strong)}
  .divider span{width:5px;height:5px;border-radius:50%;background:var(--line-strong)}
  .vid{display:block;margin:20px 0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);box-shadow:var(--shadow);transition:.18s}
  .vid:hover{transform:translateY(-2px);border-color:var(--line-strong)}
  .vid .thumb{position:relative;aspect-ratio:16/9;background:#0d0b09;overflow:hidden}
  .vid .thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
  .vid .thumb .ytplay{position:absolute;inset:0;margin:auto;width:60px;height:60px;border-radius:50%;background:rgba(232,84,58,.92);display:grid;place-items:center}
  .vid .thumb .ytplay svg{width:26px;height:26px;color:#fff}
  .vid .v-body{padding:16px 18px}
  .vid .v-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-dark)}
  .vid .v-title{font-family:"Newsreader",serif;font-size:20px;font-weight:600;margin:4px 0 8px;color:var(--ink);line-height:1.25}
  .vid .v-note{font-family:"Newsreader",serif;font-size:17px;line-height:1.6;color:var(--ink-soft);margin:0}
  .vid .v-link{margin-top:12px;font-family:"Inter",sans-serif;font-size:13px;font-weight:600;color:var(--accent-dark);display:inline-flex;align-items:center;gap:6px}
  .vid .v-link svg{width:14px;height:14px}

  .endcap{margin:48px 0;padding:28px;border-radius:var(--radius);background:var(--ink);color:#fff;text-align:center}
  .endcap h3{font-family:"Newsreader",serif;font-weight:500;font-size:26px;margin:0 0 8px}
  .endcap p{color:#c9c1b4;margin:0 auto 18px;max-width:42ch;font-size:15px;line-height:1.6}
  .endcap .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  /* ---------------- COMPOSER ---------------- */
  .composer{padding:clamp(22px,5vw,40px) 0 40px}
  .composer h2.ttl{font-family:"Newsreader",serif;font-weight:500;font-size:clamp(28px,5vw,38px);margin:0 0 6px}
  .composer .lede{color:var(--ink-soft);font-size:15px;margin:0 0 26px;max-width:52ch}
  .field{margin-bottom:20px}
  .field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:7px}
  .field label .hint{color:var(--ink-faint);font-weight:500;margin-left:6px}
  .field input,.field textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;transition:.15s}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .field textarea{min-height:280px;line-height:1.65;resize:vertical;font-family:"Newsreader",serif;font-size:18px}
  .field .title-in{font-family:"Newsreader",serif;font-size:24px;font-weight:500}
  .syntax{background:var(--card);border:1px dashed var(--line-strong);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;line-height:1.7}
  .syntax code{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
  .composer-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .composer-actions .prev-note{color:var(--ink-faint);font-size:12.5px;margin-left:auto}

  .banner-note{background:var(--accent-wash);border:1px solid #f6d8cf;color:#8a3320;border-radius:12px;padding:12px 15px;font-size:13px;line-height:1.55;margin:0 0 24px;display:flex;gap:10px}
  .banner-note svg{width:17px;height:17px;flex:none;margin-top:1px}

  footer{border-top:1px solid var(--line);margin-top:40px;padding:30px 0 60px}
  footer .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:13px}
  footer .brand{font-size:16px;cursor:default}
  footer a{color:var(--ink-soft);font-weight:500;margin-left:18px}
  footer a:hover{color:var(--ink)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:0 12px 40px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.28s;z-index:80;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* on-screen debug log (enable with ?debug=1) */
  .dbg{position:fixed;left:0;right:0;bottom:0;z-index:200;background:rgba(10,8,6,.94);color:#e8e2d6;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;border-top:2px solid var(--accent);max-height:44vh;display:flex;flex-direction:column}
  .dbg-bar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.12);flex:none}
  .dbg-bar b{color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
  .dbg-bar #dbgState{color:#a89f92;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dbg-bar button{font:inherit;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:3px 9px;cursor:pointer}
  .dbg-body{margin:0;padding:8px 10px;overflow:auto;white-space:pre-wrap;word-break:break-word;flex:1}

  @media(max-width:520px){
    .listen{top:58px}
    .play{width:52px;height:52px}
    .mini .iconbtn:not(.speed){display:none}
    article p{font-size:18.5px}
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="brand" onclick="go('#/')">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4M7 6v12M11 3v18M15 8v8M19 5v14M23 10v4"/></svg></span>
    <span>Active Listener <small>· hear what people think</small></span>
  </div>
  <div class="nav-actions">
    <button class="btn accent" onclick="go('#/new')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Post
    </button>
  </div>
</nav>

<main id="app"><!-- routed content --></main>

<footer>
  <div class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4M7 6v12M11 3v18M15 8v8M19 5v14M23 10v4"/></svg></span> Active Listener</div>
    <div>
      <a href="#/" onclick="go('#/');return false">Feed</a>
      <a href="#/new" onclick="go('#/new');return false">Write</a>
      <a href="#" onclick="toast('Listen anywhere — coming soon.');return false">About</a>
      <span id="buildStamp" style="margin-left:18px;opacity:.6;font-variant-numeric:tabular-nums"></span>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================================
   ALOUD — a tiny publish + listen platform (static prototype)
   -------------------------------------------------------------------------
   • Feed      #/            list of posts
   • Reader    #/post/:id    read it, or press play and the phone reads it (TTS)
   • Composer  #/new         anyone writes a post; it publishes to the feed

   STORAGE: posts live in localStorage right now, so this is a working
   single-device prototype. To make posts visible across every user's phone,
   swap the `store` functions for a shared backend (e.g. Supabase table
   `posts`). Everything else — the reader, the TTS engine, the composer —
   stays exactly the same.
   ========================================================================= */

/* ---------- seed: Andrew's first post ---------- */
const ANDREW_HTML = `

  async all(){
    if (CLOUD){
      try{
        const { data, error } = await sb.from('posts').select('*').order('created_at',{ascending:false});
        if (error) throw error;
        const posts = data.map(rowToPost);
        // make sure the flagship seed post exists exactly once
        for (const s of SEED){
          if (!posts.some(p => p.id === s.id)){
            try{ await sb.from('posts').upsert(postToRow(s)); posts.push(s); }catch(e){}
          }
        }
        this._cache = posts;
        return posts;
      }catch(e){
        console.warn('Cloud read failed — showing local copy.', e);
        const missing = e && (e.code==='PGRST205' || /schema cache|does not exist/i.test(e.message||''));
        if (missing) toast('Run supabase-schema.sql to enable shared posts.');
        else toast('Offline — showing local posts.');
      }
    }
    return localAll();
  },
  async get(id){
    if (this._cache){ const hit = this._cache.find(p => p.id === id); if (hit) return hit; }
    if (CLOUD){
      try{ const { data, error } = await sb.from('posts').select('*').eq('id',id).maybeSingle(); if (error) throw error; if (data) return rowToPost(data); }
      catch(e){ console.warn('Cloud fetch failed.', e); }
    }
    return localAll().find(p => p.id === id);
  },
  async add(post){
    if (CLOUD){
      try{ const { error } = await sb.from('posts').insert(postToRow(post)); if (error) throw error; this._cache = null; return true; }
      catch(e){ console.warn('Cloud publish failed — saving locally.', e); toast('Saved on this device (cloud unavailable).'); }
    }
    localAdd(post); return true;
  },
};

  const line = [...arguments].map(a=>typeof a==='object'?JSON.stringify(a):String(a)).join(' ');

  _dbgLines.push(stamp+' '+line); if(_dbgLines.length>400)_dbgLines.shift();

/* turn plain text into reader HTML with data-read blocks */
function bodyToHTML(text){
  const paras = text.replace(/\r/g,'').split(/\n{2,}/).map(s=>s.trim()).filter(Boolean);
  return paras.map(p => {
    if (p.startsWith('## ')) { const t = esc(p.slice(3).trim()); return `<h2 data-read data-chapter="${t.slice(0,40)}">${t}</h2>`; }
    if (p.startsWith('> '))  { return `<p class="pull" data-read>${esc(p.slice(2).trim())}</p>`; }
    return `<p data-read>${esc(p.replace(/\n/g,' ').trim())}</p>`;
  }).join('\n');
}
async function publish(){
  const title = document.getElementById('f-title').value.trim();
  const dek = document.getElementById('f-dek').value.trim();
  const author = document.getElementById('f-author').value.trim() || 'Anonymous';
  const tags = document.getElementById('f-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const body = document.getElementById('f-body').value.trim();
  if (!title){ toast('Add a title first.'); return; }
  if (body.split(/\s+/).filter(Boolean).length < 20){ toast('Write a little more before publishing.'); return; }
  const post = {
    id: slug(title) + '-' + Math.random().toString(36).slice(2,6),
    title, dek: dek || body.slice(0,140), author, initials: initialsOf(author),
    date: new Date().toISOString().slice(0,10),
    tags: tags.length ? tags : ['Thoughts'],
    html: bodyToHTML(body),
  };
  const btn = document.querySelector('.composer-actions .btn.accent');
  if (btn){ btn.disabled = true; btn.style.opacity = .6; btn.textContent = 'Publishing…'; }
  // Pre-generate lock-screen audio at publish time only for a fast SERVER endpoint.
  // The StreamElements POC makes many small requests, so we leave that to the
  // on-demand 🔒 button on the reader and keep publishing instant.
  if (TTS_ENDPOINT){
    if (btn) btn.textContent = 'Generating audio…';
    try{ post.audio_url = await synthNarration(post, body, true); }
    catch(e){ console.warn('narration at publish failed — post goes out without lock-screen audio.', e); }
  }
  await store.add(post);
  toast(CLOUD ? 'Published! 🎉' : 'Published (saved on this device).');
  go('#/post/'+encodeURIComponent(post.id));
}

/* =========================================================================
   PLAYER — two engines behind one set of controls:
     • audio : a real MP3 (post.audio_url) through a shared <audio> element.
               Plays in the background, survives a locked screen, and drives the
               OS lock-screen controls + position via MediaSession.
     • tts   : on-device speech synthesis fallback (paused by the OS on lock).
   A post gets audio when narration is generated (publish-time or the 🔒 button)
   via TTS_ENDPOINT. Everything below routes through player.mode.
   ========================================================================= */
const SPEEDS = [1, 1.25, 1.5, 1.75, 2, 0.75];

/* one shared, always-present audio element (created once) */
const audioEl = document.createElement('audio');
audioEl.preload = 'metadata';
audioEl.setAttribute('playsinline','');
document.body.appendChild(audioEl);

const player = {
  mode:'tts', post:null, cover:null,
  playing:false, rate:1, idx:0, speedIdx:0,
  blocks:[], chapters:[], charsBefore:[], totalChars:1, approxTotalSec:0,
  voice:null, voices:[], els:{}, mounted:false,

  mount(post){
    this.stopInternal();
    this.post = post || null;
    const $ = id => document.getElementById(id);
    this.els = {play:$('playBtn'),back:$('back15'),fwd:$('fwd30'),speed:$('speedBtn'),bar:$('bar'),fill:$('fill'),knob:$('knob'),tCur:$('tCur'),tDur:$('tDur'),voiceSelect:$('voiceSelect'),voicePick:$('voicePick'),genBtn:$('genBtn'),modeLabel:$('modeLabel'),listenSub:$('listenSub'),qualityText:$('qualityText'),chList:$('chList'),chapters:$('chapters')};
    if (!this.els.play){ this.mounted=false; return; }
    this.mounted = true;
    this.rate = SPEEDS[this.speedIdx];
    this.idx = 0;

    // readable blocks -> flatten to sentence-sized UNITS. iOS Safari stalls on
    // long utterances (it reads to the first period and stops), so we speak one
    // short sentence at a time. Each unit keeps its block element for the
    // follow-along highlight and the chapter label on its first sentence.
    this.blocks = [...document.querySelectorAll('#article [data-read]')].map(el=>({el,text:(el.getAttribute('data-read')||el.textContent).trim(),chapter:el.dataset.chapter||null}));
    this.units = [];
    this.blocks.forEach(b=>{ splitSentences(b.text).forEach((t,si)=>this.units.push({el:b.el, text:t, chapter: si===0?b.chapter:null})); });
    if (!this.units.length) this.units=[{el:document.body,text:'',chapter:null}];
    const full = this.units.map(u=>u.text).join(' ');
    this.totalChars = Math.max(1, full.length);
    let acc=0; this.charsBefore = this.units.map(u=>{const v=acc;acc+=u.text.length+1;return v;});
    this.approxTotalSec = this.totalChars/15/this.rate;

    // chapters — jump to the unit that begins each chapter
    this.chapters = this.units.map((u,idx)=>({el:u.el,chapter:u.chapter,idx})).filter(u=>u.chapter);
    this.els.chList.innerHTML='';
    this.chapters.forEach((c,i)=>{
      const b=document.createElement('button'); b.className='ch';
      b.innerHTML=`<span class="n">${String(i+1).padStart(2,'0')}</span> <span>${esc(c.chapter)}</span>`;
      b.onclick=()=>{ c.el.scrollIntoView({behavior:'smooth',block:'start'}); this.els.chapters.open=false; if(this.mode==='tts'&&this.playing) this.jumpTo(c.idx); };
      this.els.chList.appendChild(b);
    });

    // lock-screen cover art + media metadata
    this.cover = post ? makeCover(post) : null;
    setupMediaSession();
    if ('mediaSession' in navigator && post){
      try{ navigator.mediaSession.metadata = new MediaMetadata({title:post.title, artist:post.author||'Active Listener', album:'Active Listener', artwork:this.cover?[{src:this.cover,sizes:'512x512',type:'image/png'}]:[]}); }catch(e){}
    }

    // wire transport
    this.els.play.onclick=()=>this.toggle();
    this.els.back.onclick=()=>this.seekRel(-15);
    this.els.fwd.onclick=()=>this.seekRel(30);
    this.els.speed.onclick=()=>{ this.speedIdx=(this.speedIdx+1)%SPEEDS.length; this.setRate(SPEEDS[this.speedIdx]); this.els.speed.textContent=SPEEDS[this.speedIdx]+'×'; };
    this.els.bar.onclick=e=>{ const r=this.els.bar.getBoundingClientRect(); this.seekFraction((e.clientX-r.left)/r.width); };
    if (this.els.genBtn) this.els.genBtn.onclick=()=>this.generate();

    // choose engine
    if (post && post.audio_url){ this.enableAudio(post.audio_url); }
    else { this.enableTTS(); }
  },

  /* ---------------- AUDIO ENGINE (lock-screen) ---------------- */
  enableAudio(url){
    this.mode='audio';
    audioEl.src=url; audioEl.playbackRate=this.rate; audioEl.currentTime=0;
    this.els.modeLabel.textContent='Narrated audio';
    this.els.listenSub.textContent='Real audio — keeps playing with your screen locked.';
    this.els.qualityText.textContent='Lock-screen ready 🔒';
    if(this.els.voicePick) this.els.voicePick.style.display='none';
    if(this.els.genBtn) this.els.genBtn.hidden=true;
    this.setProgress(0,0,audioEl.duration||0);
  },

  /* ---------------- TTS ENGINE (on-device) ---------------- */
  enableTTS(){
    this.mode='tts';
    if(this.els.voicePick) this.els.voicePick.style.display='';
    if (!('speechSynthesis' in window)){
      this.els.listenSub.textContent='Your browser can’t read aloud — try Chrome, Edge, or Safari.';
      this.els.play.disabled=true; return;
    }
    this.els.modeLabel.textContent='Read this to me';
    this.els.listenSub.textContent = canGenerate
      ? 'On-device voice. Tap 🔒 to make it play with the screen locked.'
      : 'On-device voice — best kept with the screen on.';
    if(this.els.genBtn) this.els.genBtn.hidden = !canGenerate;
    this.loadVoices();
    speechSynthesis.onvoiceschanged=()=>this.loadVoices();
    this._pollVoices(0);
    this.setProgress(0,0,this.approxTotalSec);
  },

  /* voiceschanged doesn't fire on every browser — poll a few seconds, and if the
     device really has no speech voices installed, say so plainly. */
  _pollVoices(n){
    if (this.mode!=='tts' || (this.voices && this.voices.length)) return;
    this.loadVoices();
    if (this.voices && this.voices.length) return;
    if (n>=20){ this._noVoices(); return; }
    setTimeout(()=>this._pollVoices(n+1), 250);
  },
  _noVoices(){
    dbg('NO VOICES available on this browser');
    this.els.voiceSelect.innerHTML='<option>No voices installed</option>';
    this.els.qualityText.textContent='No voice on this device';
    this.els.listenSub.innerHTML='This browser has no speech voices installed. On Linux: <code>sudo apt install speech-dispatcher espeak-ng</code> then restart the browser — or open this on a phone/Mac/Windows, which ship voices. (Server-side narration removes this need — see SETUP.md.)';
    this.els.play.disabled=true;
  },

  loadVoices(){
    let all = speechSynthesis.getVoices().filter(v=>v.lang && v.lang.startsWith('en'));
    if (!all.length){ const any=speechSynthesis.getVoices(); if(any.length) all=any.slice(); } // no English? use whatever exists
    if (!all.length) return;
    this.els.play.disabled=false;
    const remote = v=>/google|online|cloud|natural|neural|wavenet/i.test(v.name+' '+v.voiceURI) && !v.localService;
    // Prefer ON-DEVICE voices: they always produce audio, where cloud voices can
    // silently fail (which was making the reader skip through with no sound).
    const score = v=>{ const n=(v.name+' '+v.voiceURI).toLowerCase(); let s=0;
      if(v.localService)s+=1000;                                   // on-device wins
      if(/samantha|alex|daniel|karen|moira|tessa|fiona|serena|ava|allison|victoria/.test(n))s+=40;
      if(/premium|enhanced|natural|neural/.test(n))s+=20;
      if(v.lang==='en-US'||v.lang==='en-GB')s+=10;
      if(remote(v))s-=200;                                         // deprioritise cloud
      return s; };
    all.sort((a,b)=>score(b)-score(a));
    this.voices=all;
    // keep any current pick if it survived a voiceschanged refresh
    const prevURI = this.voice && this.voice.voiceURI;
    this.els.voiceSelect.innerHTML='';
    all.forEach((v,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=v.name.replace(/\(.*?\)/,'').trim()+(v.localService?'':' ☁'); this.els.voiceSelect.appendChild(o); });
    let idx = prevURI ? all.findIndex(v=>v.voiceURI===prevURI) : -1;
    if (idx<0) idx = 0; // best on-device voice
    this.els.voiceSelect.value=idx; this.voice=all[idx];
    dbg('voices loaded:', all.length, '| chosen:', this.voice.name, '| local:', this.voice.localService, '| lang:', this.voice.lang);
    this.els.voiceSelect.onchange=()=>{ this.voice=all[+this.els.voiceSelect.value]; this._fails=0; this._reflectVoiceQuality(); dbg('voice changed ->', this.voice.name, 'local:', this.voice.localService); if(this.playing && this.mode==='tts') this.jumpTo(this.idx); };
    if(this.mode==='tts') this._reflectVoiceQuality();
  },

  _reflectVoiceQuality(){ if(this.voice) this.els.qualityText.textContent = this.voice.localService ? 'On-device voice' : 'Cloud voice ☁'; },
  _bestLocalVoice(){ return this.voices.find(v=>v.localService) || null; },

  /* ---------------- generate narration on demand ---------------- */
  async generate(){
    if (!canGenerate || !this.post) return;
    const btn=this.els.genBtn; const label=btn.textContent;
    this.stopInternal();                       // stop on-device reading while we fetch
    btn.disabled=true; btn.textContent='Generating…';
    toast('Generating audio… first time can take a moment.');
    dbg('generate() start');
    try{
      const text = this.blocks.map(b=>b.text).join('\n\n');
      const url = await synthNarration(this.post, text, true);
      this.post.audio_url = url;
      this.enableAudio(url);
      dbg('generate() done ->', url.slice(0,32));
      toast('Lock-screen audio ready 🔒▶');
      this.play();
    }catch(e){ console.warn('generate failed',e); dbg('generate FAILED:', e&&e.message); toast('Audio failed: '+(e&&e.message||'unknown')); btn.disabled=false; btn.textContent=label; }
  },

  /* ---------------- shared controls ---------------- */
  toggle(){ this.playing?this.pause():this.play(); },
  play(){
    if (!this.mounted) return;
    if (this.mode==='audio'){ audioEl.play().catch(()=>{}); this.setPlaying(true); return; }
    if (!('speechSynthesis' in window)) return;
    this.setPlaying(true);
    if (speechSynthesis.paused && speechSynthesis.speaking){ speechSynthesis.resume(); return; }
    this.jumpTo(this.idx);
  },
  pause(){
    if (this.mode==='audio') audioEl.pause();
    else { clearTimeout(this._t); try{ speechSynthesis.pause(); }catch(e){} }
    this.setPlaying(false);
  },
  stop(){ this.stopInternal(); },
  stopInternal(){
    clearTimeout(this._t); clearTimeout(this._watch);
    if ('speechSynthesis' in window) try{ speechSynthesis.cancel(); }catch(e){}
    try{ audioEl.pause(); }catch(e){}
    this.playing=false; document.body.classList.remove('playing'); this.clearHL(); this.idx=0;
    if ('mediaSession' in navigator) try{ navigator.mediaSession.playbackState='none'; }catch(e){}
  },
  setPlaying(p){ this.playing=p; document.body.classList.toggle('playing',p); if('mediaSession' in navigator) try{navigator.mediaSession.playbackState=p?'playing':'paused';}catch(e){} },

  setRate(r){
    this.rate=r;
    if (this.mode==='audio'){ audioEl.playbackRate=r; }
    else { this.approxTotalSec=this.totalChars/15/r; if(this.playing) this.jumpTo(this.idx); else this.setProgress(this.charsBefore[this.idx]/this.totalChars, null, this.approxTotalSec); }
  },

  seekRel(sec){
    if (this.mode==='audio'){ audioEl.currentTime=Math.max(0,Math.min(audioEl.duration||0, audioEl.currentTime+sec)); return; }
    const dir=sec>0?1:-1; const jump=Math.max(1,Math.round(Math.abs(sec)/4));
    this.jumpTo(Math.max(0,Math.min(this.units.length-1,this.idx+dir*jump)));
  },
  seekFraction(f){
    if (this.mode==='audio'){ if(isFinite(audioEl.duration)) audioEl.currentTime=f*audioEl.duration; return; }
    const target=f*this.totalChars; let i=this.charsBefore.findIndex((c,idx)=>idx===this.units.length-1||this.charsBefore[idx+1]>target); if(i<0)i=0; this.jumpTo(i);
  },

  /* (re)start speech at unit i — cancel then speak after a beat, because Chrome
     drops an utterance spoken in the same tick as cancel(). Used for start/seek. */
  jumpTo(i){
    if (!('speechSynthesis' in window)) return;
    dbg('jumpTo', i, 'of', this.units.length);
    clearTimeout(this._t); clearTimeout(this._watch);
    try{ speechSynthesis.cancel(); }catch(e){}
    this._fails=0;
    this.playing = true; document.body.classList.add('playing');
    this._t = setTimeout(()=>{ try{ speechSynthesis.resume(); }catch(e){} this._speak(i); }, 110);
  },

  /* speak ONE sentence unit and chain to the next without cancelling. Guards:
     - onstart confirms audio actually began (a silent utterance = failure);
     - a watchdog advances if iOS stalls an utterance without firing onend. */
  _speak(i){
    if (!this.playing || this.mode!=='tts') return;
    if (i>=this.units.length){ this.stopInternal(); this.setProgress(1,this.approxTotalSec,this.approxTotalSec); return; }
    this.idx=i;
    const unit=this.units[i]; this.highlight(unit.el);
    this.setProgress(this.charsBefore[i]/this.totalChars,(this.charsBefore[i]/this.totalChars)*this.approxTotalSec,this.approxTotalSec);
    if (!unit.text){ this._speak(i+1); return; }
    const u=new SpeechSynthesisUtterance(unit.text);
    if(this.voice) u.voice=this.voice;
    u.lang=(this.voice&&this.voice.lang)||'en-US'; u.rate=this.rate; u.pitch=1;
    dbg('speak', i, JSON.stringify(unit.text.slice(0,44)));
    const t0=performance.now(); let started=false, done=false;
    const clearWatch=()=>clearTimeout(this._watch);
    u.onstart=()=>{ started=true; this._fails=0; dbg('  onstart', i); };
    u.onend=()=>{
      const ms=Math.round(performance.now()-t0);
      if(done){ dbg('  onend(dup)', i); return; } done=true; clearWatch();
      dbg('  onend', i, 'started='+started, ms+'ms');
      if(!this.playing || this.mode!=='tts' || this.idx!==i) return;
      if(!started && ms < 350){ this._speakFailed(i); return; } // never actually spoke
      this._fails=0; this._speak(i+1);
    };
    u.onerror=(e)=>{
      const err=e&&e.error; if(done) return;
      dbg('  onerror', i, err);
      if(err==='interrupted'||err==='canceled'){ done=true; clearWatch(); return; }
      done=true; clearWatch();
      if(!this.playing || this.mode!=='tts' || this.idx!==i) return;
      this._speakFailed(i);
    };
    // watchdog: iOS Safari sometimes halts a long-ish utterance and never fires
    // onend. Estimate speak time and, if nothing happened, cancel and move on.
    const estMs = (unit.text.length/(11*this.rate))*1000 + 4000;
    this._watch=setTimeout(()=>{ if(done||!this.playing||this.idx!==i) return; done=true; dbg('  WATCHDOG advance', i, '(no onend in', Math.round(estMs)+'ms)'); try{speechSynthesis.cancel();}catch(e){} this._speak(i+1); }, estMs);
    try{ speechSynthesis.resume(); speechSynthesis.speak(u); }
    catch(err){ done=true; clearWatch(); dbg('  speak() threw', String(err)); this._speakFailed(i); }
  },

  /* an utterance produced no sound — recover instead of skipping */
  _speakFailed(i){
    this._fails=(this._fails||0)+1;
    dbg('  FAILED', i, 'fails='+this._fails, 'voice='+(this.voice&&this.voice.name));
    if(this._fails===1 && this.voice && !this.voice.localService){
      // most likely a failing cloud voice — switch to on-device and retry
      const local=this._bestLocalVoice();
      if(local){ this.voice=local; const idx=this.voices.indexOf(local); if(idx>=0)this.els.voiceSelect.value=idx; this._reflectVoiceQuality(); toast('Switched to an on-device voice.'); }
      setTimeout(()=>{ if(this.playing) this._speak(i); }, 120); return;
    }
    if(this._fails<=4){ setTimeout(()=>{ if(this.playing) this._speak(i); }, 150); return; } // brief backoff
    this.stopInternal(); toast('That voice isn’t producing sound — try another from the voice menu.');
  },

  setProgress(frac,cur,dur){ frac=Math.max(0,Math.min(1,frac||0)); this.els.fill.style.width=(frac*100)+'%'; this.els.knob.style.left=(frac*100)+'%'; const pre=this.mode==='tts'?'~':''; if(cur!=null)this.els.tCur.textContent=fmt(cur); if(dur!=null)this.els.tDur.textContent=pre+fmt(dur); },
  highlight(el){ if(this._hl===el) return; this.clearHL(); this._hl=el; el.classList.add('read-active'); const r=el.getBoundingClientRect(); if(r.top<160||r.bottom>innerHeight-40) el.scrollIntoView({behavior:'smooth',block:'center'}); },
  clearHL(){ if(this._hl){ this._hl.classList.remove('read-active'); this._hl=null; } },
};

/* audio-element events drive progress + lock-screen position (audio mode) */
audioEl.addEventListener('loadedmetadata',()=>{ if(player.mode==='audio') player.setProgress(0,0,audioEl.duration); });
audioEl.addEventListener('timeupdate',()=>{ if(player.mode!=='audio')return; const d=audioEl.duration||0; player.setProgress(d?audioEl.currentTime/d:0, audioEl.currentTime, d); updatePositionState(); });
audioEl.addEventListener('ended',()=>player.stopInternal());
audioEl.addEventListener('play',()=>{ if(player.mode==='audio') player.setPlaying(true); });
audioEl.addEventListener('pause',()=>{ if(player.mode==='audio' && !audioEl.ended) player.setPlaying(false); });

function fmt(s){ if(!isFinite(s)||s<0)return '--:--'; s=Math.round(s); const m=Math.floor(s/60),ss=s%60; return m+':'+String(ss).padStart(2,'0'); }

/* split a paragraph into sentence-sized chunks (kept short so iOS speaks them
   reliably); long sentences are hard-split so no single utterance is huge. */
function splitSentences(text){
  const parts = (text.match(/[^.!?]+[.!?]+["'”’)\]]*\s*|[^.!?]+$/g) || [text]).map(s=>s.trim()).filter(Boolean);
  const out=[];
  for (const p of parts){
    if (p.length<=240){ out.push(p); continue; }
    for (let i=0;i<p.length;i+=240){ out.push(p.slice(i,i+240).trim()); } // very long sentence
  }
  return out.length ? out : [text];
}

/* synthesize narration to one MP3 blob, via TTS_ENDPOINT (server) or the free
   StreamElements POC; persist to Supabase Storage when possible */
async function synthNarration(post, text, persist){
  let blob;
  if (TTS_ENDPOINT){
    dbg('narrate via endpoint', TTS_ENDPOINT);
    const res = await fetch(TTS_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, voice:TTS_VOICE})});
    if (!res.ok) throw new Error('TTS endpoint '+res.status);
    blob = await res.blob();
  } else if (SE_ENABLED){
    blob = await synthStreamElements(text);
  } else {
    throw new Error('no TTS configured');
  }
  let url = URL.createObjectURL(blob);
  if (persist && CLOUD){
    try{
      const path = post.id + '.mp3';
      const up = await sb.storage.from(NARRATION_BUCKET).upload(path, blob, {upsert:true, contentType:'audio/mpeg'});
      if (!up.error){
        const pub = sb.storage.from(NARRATION_BUCKET).getPublicUrl(path);
        if (pub.data && pub.data.publicUrl){
          url = pub.data.publicUrl;
          try{ await sb.from('posts').update({audio_url:url}).eq('id',post.id); }catch(e){ /* needs an update policy; falls back to public URL */ }
        }
      }
    }catch(e){ console.warn('narration persist failed — using session audio.', e); }
  }
  return url;
}

/* StreamElements free TTS: chunk under its length limit, fetch each chunk as MP3,
   concatenate into one seekable track. No key; called straight from the browser. */
async function synthStreamElements(text){
  const chunks = seChunks(text, 280);
  dbg('StreamElements: '+chunks.length+' chunk(s), voice '+SE_VOICE);
  const parts = [];
  for (let i=0;i<chunks.length;i++){
    const url = 'https://api.streamelements.com/kappa/v2/speech?voice='+encodeURIComponent(SE_VOICE)+'&text='+encodeURIComponent(chunks[i]);
    let res;
    try{ res = await fetch(url); }catch(e){ throw new Error('StreamElements network/CORS error'); }
    if (!res.ok) throw new Error('StreamElements '+res.status+(res.status===400?' (chunk too long?)':''));
    const ct = res.headers.get('content-type')||'';
    if (!/audio/i.test(ct)) throw new Error('StreamElements returned '+(ct||'no audio'));
    parts.push(new Uint8Array(await res.arrayBuffer()));
    dbg('  chunk '+(i+1)+'/'+chunks.length+' ok');
  }
  return new Blob(parts, {type:'audio/mpeg'});
}
/* pack sentences into chunks under `limit` chars (StreamElements caps text length) */
function seChunks(text, limit){
  const out=[]; let buf='';
  for (const s of splitSentences(text)){
    if ((buf+' '+s).trim().length > limit){
      if (buf){ out.push(buf.trim()); buf=''; }
      if (s.length > limit){ for(let i=0;i<s.length;i+=limit) out.push(s.slice(i,i+limit).trim()); }
      else buf=s;
    } else buf = buf ? buf+' '+s : s;
  }
  if (buf.trim()) out.push(buf.trim());
  return out.length ? out : [text.slice(0,limit)];
}

/* generate a 512×512 lock-screen cover from the post */
function makeCover(post){
  try{
    const c=document.createElement('canvas'); c.width=c.height=512; const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,512,512); g.addColorStop(0,'#1c1813'); g.addColorStop(1,'#2a231b');
    x.fillStyle=g; x.fillRect(0,0,512,512);
    x.fillStyle='#e8543a'; x.beginPath(); x.arc(96,96,34,0,7); x.fill();
    x.fillStyle='#fff'; x.beginPath(); x.moveTo(86,80); x.lineTo(86,112); x.lineTo(114,96); x.closePath(); x.fill();
    x.fillStyle='#d9b7ad'; x.font='600 22px Inter, sans-serif'; x.fillText('ACTIVE LISTENER', 148, 104);
    // wrapped title
    x.fillStyle='#fbfaf7'; x.font='600 46px Newsreader, Georgia, serif';
    const words=(post.title||'').split(' '); let line='', y=250; const lines=[];
    for(const w of words){ const t=line?line+' '+w:w; if(x.measureText(t).width>430 && line){ lines.push(line); line=w; } else line=t; }
    if(line) lines.push(line);
    lines.slice(0,4).forEach(l=>{ x.fillText(l,56,y); y+=58; });
    x.fillStyle='#a89f92'; x.font='500 26px Inter, sans-serif'; x.fillText(post.author||'', 56, Math.min(y+18,470));
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}

function setupMediaSession(){
  if (!('mediaSession' in navigator)) return;
  const set=(a,fn)=>{try{navigator.mediaSession.setActionHandler(a,fn);}catch(e){}};
  set('play',()=>player.play()); set('pause',()=>player.pause());
  set('seekbackward',e=>player.seekRel(-(e&&e.seekOffset||15)));
  set('seekforward',e=>player.seekRel(e&&e.seekOffset||30));
  set('previoustrack',()=>player.seekRel(-15));
  set('nexttrack',()=>player.seekRel(30));
  set('stop',()=>player.stop());
  set('seekto',e=>{ if(player.mode==='audio' && e.seekTime!=null) audioEl.currentTime=e.seekTime; });
}
function updatePositionState(){
  if (player.mode!=='audio' || !('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  if (isFinite(audioEl.duration)){ try{ navigator.mediaSession.setPositionState({duration:audioEl.duration, position:audioEl.currentTime, playbackRate:audioEl.playbackRate}); }catch(e){} }
}

/* Keep TTS alive. We now speak one short sentence at a time, so Chrome's ~15s
   single-utterance cutoff can't trigger and the old pause()/resume() keepalive
   (which also stuttered playback and broke Apple WebKit) is gone. We only nudge
   a resume if something accidentally left the queue paused. */
setInterval(()=>{
  if(player.mode!=='tts' || !player.playing || !('speechSynthesis' in window)) return;
  if(speechSynthesis.paused){ dbg('keepalive: resuming a paused queue'); try{ speechSynthesis.resume(); }catch(e){} }
}, 8000);
document.addEventListener('keydown',e=>{ if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return; if(!player.mounted)return; if(e.code==='Space'){e.preventDefault();player.toggle();} else if(e.code==='ArrowLeft')player.seekRel(-15); else if(e.code==='ArrowRight')player.seekRel(30); });

/* boot */
const BUILD = 'build 2026-09-23 · full-essay';
try{ const bs=document.getElementById('buildStamp'); if(bs) bs.textContent = BUILD; }catch(e){}
console.log('[Active Listener]', BUILD);
route();
</script>
