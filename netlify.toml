# Static single-file app — no build step. Force browsers/CDN to revalidate the
# HTML every load so a new deploy is never masked by a cached old index.html.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
